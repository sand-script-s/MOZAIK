    <div class="fullspan">
        <div class="background-container">
            <div class="background-image" id="crevice-background"></div>
        </div>
        <div class="foreground-grid">
            <div class="foreground-left-column"></div>
            <div class="foreground-center-column">
                <div class="ratio-container">
                    <div class="main-down-flex">
                        <div class="film-grid">

                            <div id="filmstrip-left-perforations" class="film-perforations">
                                
                                <!-- This SVG creates the perforated filmstrip along the left side of the main content box -->
                                <svg class="filmstrip-SVG" viewBox="0 0 48.0833 14152.5" xmlns="http://www.w3.org/2000/svg">
                                    <defs>
                                        <!-- This pattern duplicates the hole shape downward -->
                                        <pattern id="filmstrip-pattern-left" class="filmstrip-pattern" width="48.0833" height="39.3229" patternUnits="userSpaceOnUse">
                                            <!-- This rectangle defines the shape of the holes-->
                                            <rect id="filmstrip-holeshape-left" class="filmstrip-hole" x="14.5404" y="8.2578" width="22.1183" height="15.7292" rx="3.9323" ry="3.9323" fill="black" />
                                        </pattern>
                                
                                        <!-- Define the mask using the pattern -->
                                        <mask id="filmstrip-mask-left">
                                            <!-- The svg will be visible wherever this rectangle remains white -->
                                            <rect x="-10%" y="-2%" width="120%" height="104%" fill="white" />
                                            <!-- Use the pattern to put the black hole shapes over the white rectangle above-->
                                            <rect x="0" y="0" width="100%" height="100%" fill="url(#filmstrip-pattern-left)" />
                                        </mask>

                                        <!-- Define the blur filter -->
                                        <filter id="filmstrip-blurfilter-left" x="-10%" y="-2%" width="120%" height="104%">
                                            <feGaussianBlur in="SourceGraphic" stdDeviation="1" />
                                        </filter>
                                    </defs>
                                
                                    <!-- Apply the mask to the blue rectangle along with the blur filter, this delivers the final visible svg element one sees -->
                                    <rect class="filmreel-strip" x="-10%" y="-2%" width="120%" height="104%" fill="blue" mask="url(#filmstrip-mask-left)" filter="url(#filmstrip-blurfilter-left)" />
                                </svg>

                            </div>

                            <div class="film-middle-content">

                                <div class="snug-middle-content">

                                    <!-- 'fitted' refers to elements that get ratios added to their CSS via the getratios.js script -->
                                    <div class="header-block fitted addspacing-2">
                                        <div class="header-content">
                                            <div class="collage-header">~ Crevice ~</div>
                                            <div class="underline-block">
                                                <div class="underline-outercontainer"><div class="underline-style underline-main"></div></div>
                                                <div class="underline-outercontainer"><div class="underline-style underline-second"></div></div>
                                            </div>
                                        </div>
                                    </div> 

                                    <div class="content-down-flex">
            
                                        <!-- 'ytstandard' refers to a post containing a single YouTube video with no added spacing-->
                                        <div class="post ytstandard fitted" id="post_1">
                                            <div class="post-content">
                                                <div class="ytvids">
                                                    <lite-youtube videoid="ffLIVeWhsfs" playlabel="Chernobyl Episode 1 Scene | HBO | The Air Is Glowing!"></lite-youtube>
                                                </div>
                                            </div>
                                        </div>

                                        <div class="post ytstandard fitted" id="post_2">
                                            <div class="post-content">
                                                <div class="ytvids">
                                                    <lite-youtube videoid="49lY0HqqUVc" playlabel="Rihanna - Kiss It Better (Explicit)"></lite-youtube>
                                                </div>
                                            </div>
                                        </div>

                                        <div class="post ytstandard fitted" id="post_3">
                                            <div class="post-content">
                                                <div class="ytvids">
                                                    <lite-youtube videoid="U5rvOrcvy5Q" playlabel="Lisa Frankenstein | Official Trailer"></lite-youtube>
                                                </div>
                                            </div>
                                        </div>

                            
                                        <div class="post fitted addspacing-1" id="post_59">
                                            <div class="post-content"></div>               
                                        </div>                                                          
                                        
                                    </div>
                                </div>

                            </div>

                            <div id="film-right-perforations" class="film-perforations">

                                <!-- This SVG creates the perforated filmstrip along the right side of the main content box -->
                                <svg class="filmstrip-SVG" viewBox="0 0 48.0833 14152.5" xmlns="http://www.w3.org/2000/svg">                                    
                                    <defs>
                                        <!-- This pattern duplicates the hole shape downward -->
                                        <pattern id="filmstrip-pattern-right" class="filmstrip-pattern" width="48.0833" height="39.3229" patternUnits="userSpaceOnUse">
                                            <!-- This rectangle defines the shape of the holes-->
                                            <rect id="filmstrip-holeshape-right" class="filmstrip-hole" x="11.4246" y="8.2578" width="22.1183" height="15.7292" rx="3.9323" ry="3.9323" fill="black" />
                                        </pattern>
                                
                                        <!-- Define the mask using the pattern -->
                                        <mask id="filmstrip-mask-right">
                                            <!-- The svg will be visible wherever this rectangle remains white -->
                                            <rect x="-10%" y="-2%" width="120%" height="104%" fill="white" />
                                            <!-- Use the pattern to put the black hole shapes over the white rectangle above-->
                                            <rect x="0" y="0" width="100%" height="100%" fill="url(#filmstrip-pattern-right)" />
                                        </mask>

                                        <!-- Define the blur filter -->

                                    <rect class="filmreel-strip" x="-10%" y="-2%" width="120%" height="104%" fill="blue" mask="url(#filmstrip-mask-right)" filter="url(#filmstrip-blurfilter-right)" />
                                </svg>
                                  
                            </div>

                        </div>                       
                    </div>
                </div>
